openapi: 3.0.3
info:
  title: MerchantPay API
  version: 0.1.0
  description: Work in progress. Independent educational simulated payments API, no
    affiliation with Lemonway. No real payments or banking data. Reads are public;
    fictional data only. Write access uses a shared demo key.
  license:
    name: MIT
servers:
- url: https://merchantpay-production.up.railway.app
- url: http://127.0.0.1:8080
paths:
  /:
    get:
      summary: Project landing page
      responses:
        '200':
          description: HTML presentation
          content:
            text/html:
              schema:
                type: string
  /health:
    get:
      summary: Liveness only; does not test database readiness
      responses:
        '200':
          description: Health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/merchants:
    post:
      security: &id001
      - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMerchant'
      responses:
        '201':
          description: Merchant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Create a fictional merchant
      operationId: createMerchant
  /api/merchants/{id}:
    get:
      summary: Read merchant
      parameters:
      - &id002
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Merchant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/payments:
    post:
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayment'
      responses:
        '201':
          description: Payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                enum:
                - 'true'
                - 'false'
              description: true on 200 replay; false on 201
            Location:
              schema:
                type: string
              description: Relative payment resource URL
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Body exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                enum:
                - 'true'
                - 'false'
              description: true on 200 replay; false on 201
            Location:
              schema:
                type: string
              description: Relative payment resource URL
        '404':
          description: Merchant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Same key, different validated content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Simulate a payment; key scoped to merchant
      operationId: createPayment
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,128}$
  /api/payments/{id}:
    get:
      summary: Read payment
      parameters:
      - *id002
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/merchants/{id}/payments:
    get:
      summary: List payments newest first
      parameters:
      - *id002
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
          minimum: 0
          maximum: 1000000
      responses:
        '200':
          description: PaymentList
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentList'
        '404':
          description: Merchant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    CreateMerchant:
      type: object
      required:
      - name
      - email
      properties:
        name: &id003
          type: string
          minLength: 1
          maxLength: 120
        email: &id004
          type: string
          format: email
          maxLength: 254
      additionalProperties: false
    CreatePayment:
      type: object
      required:
      - merchantId
      - amount
      - currency
      - externalReference
      properties:
        merchantId: &id005
          type: string
          format: uuid
        amount: &id006
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Integer cents. No fractional values or numeric strings.
        currency: &id007
          type: string
          enum:
          - EUR
          - USD
          - GBP
        externalReference: &id008
          type: string
          minLength: 1
          maxLength: 120
          description: Prefix fail_ simulates FAILED; otherwise SUCCEEDED.
      additionalProperties: false
    Merchant:
      type: object
      required:
      - id
      - name
      - email
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        name: *id003
        email: *id004
        createdAt:
          type: string
          format: date-time
    Payment:
      type: object
      required:
      - id
      - merchantId
      - amount
      - currency
      - externalReference
      - status
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        merchantId: *id005
        amount: *id006
        currency: *id007
        externalReference: *id008
        status:
          type: string
          enum:
          - PENDING
          - SUCCEEDED
          - FAILED
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - message
          - details
          properties:
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    Health:
      type: object
      required:
      - status
      - service
      - mode
      properties:
        status:
          type: string
          enum:
          - ok
        service:
          type: string
        mode:
          type: string
          enum:
          - simulation
    PaymentList:
      type: object
      required:
      - data
      - limit
      - offset
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        limit:
          type: integer
        offset:
          type: integer
